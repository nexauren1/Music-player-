plugins { id 'com.android.application' }

android {
    namespace 'com.nexauren.musicplayer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nexauren.musicplayer'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.7.0'
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            def ksStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
            def ksKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (ksPath && ksStorePassword && ksAlias && ksKeyPassword) {
                storeFile file(ksPath)
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.work:work-runtime:2.11.2'
}
