name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate PayPal Sandbox credentials
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PAYPAL_CLIENT_ID:-}" ] && [ -z "${PAYPAL_CLIENT_SECRET:-}" ]; then
            echo "PayPal Sandbox credentials are not configured yet; skipping validation."
            exit 0
          fi

          if [ -z "${PAYPAL_CLIENT_ID:-}" ] || [ -z "${PAYPAL_CLIENT_SECRET:-}" ]; then
            echo "Both PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET are required."
            exit 1
          fi

          response="$(curl -fsS -X POST \
            "https://api-m.sandbox.paypal.com/v1/oauth2/token" \
            -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" \
            -H "Accept: application/json" \
            -H "Accept-Language: en_US" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")"

          echo "$response" | jq -e '.access_token and .token_type == "Bearer"' >/dev/null
          echo "PayPal Sandbox credentials validated successfully."

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] && [ -z "${KEYSTORE_PASSWORD:-}" ] && [ -z "${KEY_ALIAS:-}" ] && [ -z "${KEY_PASSWORD:-}" ]; then
            echo "No signing Secrets configured; building a test APK."
            exit 0
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "All four signing Secrets are required together."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/music-player-release.jks
          chmod 600 app/music-player-release.jks

      - name: Build Music Player APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f app/music-player-release.jks ]; then
            KEYSTORE_PATH="$PWD/app/music-player-release.jks" \
            KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            KEY_ALIAS="$KEY_ALIAS" \
            KEY_PASSWORD="$KEY_PASSWORD" \
            gradle :app:assembleRelease \
              -PPAYPAL_CLIENT_ID="${{ secrets.PAYPAL_CLIENT_ID }}" \
              -PPAYPAL_QUARTERLY_URL="${{ vars.PAYPAL_QUARTERLY_URL }}" \
              -PPAYPAL_LIFETIME_URL="${{ vars.PAYPAL_LIFETIME_URL }}" \
              -PPAYPAL_WORKER_URL="https://icy-bread-c703.nexaurenstore.workers.dev" \
              -PUPDATE_MANIFEST_URL="${{ vars.UPDATE_MANIFEST_URL }}"
          else
            gradle :app:assembleDebug \
              -PPAYPAL_CLIENT_ID="${{ secrets.PAYPAL_CLIENT_ID }}" \
              -PPAYPAL_QUARTERLY_URL="${{ vars.PAYPAL_QUARTERLY_URL }}" \
              -PPAYPAL_LIFETIME_URL="${{ vars.PAYPAL_LIFETIME_URL }}" \
              -PUPDATE_MANIFEST_URL="${{ vars.UPDATE_MANIFEST_URL }}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk -F'"' '/versionName =/{print $2}' app/build.gradle.kts | head -1)"
          TAG="v${VERSION}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "${APK}" "app-release.apk"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          gh release create "${TAG}" "app-release.apk" \
            --title "Music Player ${VERSION}" \
            --notes "Music Player ${VERSION} release. APK attached."

# PAYPAL_CLIENT_SECRET is intentionally not passed into the Android build.
# Client secrets must stay server-side and must never be embedded in an APK.
# Before public production distribution, add a persistent signing key and
# switch this workflow to build a signed release APK.

