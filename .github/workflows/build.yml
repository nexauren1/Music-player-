name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            -PPAYPAL_CLIENT_ID="${{ secrets.PAYPAL_CLIENT_ID }}" \
            -PPAYPAL_CHECKOUT_URL="${{ vars.PAYPAL_CHECKOUT_URL }}" \
            -PUPDATE_MANIFEST_URL="${{ vars.UPDATE_MANIFEST_URL }}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-music-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk -F'"' '/versionName =/{print $2}' app/build.gradle.kts | head -1)"
          TAG="v${VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          gh release create "${TAG}" "${APK}" \
            --title "Nexa Music ${VERSION}" \
            --notes "Nexa Music ${VERSION} build." \
            --prerelease

# PAYPAL_CLIENT_SECRET is intentionally not passed to the Android build.
# Client secrets must stay server-side and must never be embedded in an APK.
# Before public production distribution, add a persistent signing key as a
# GitHub Secret and change the workflow to build a signed release APK.
