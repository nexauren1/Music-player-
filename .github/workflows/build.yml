name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare production release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 must be configured.}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD must be configured.}"
          : "${KEY_ALIAS:?KEY_ALIAS must be configured.}"
          : "${KEY_PASSWORD:?KEY_PASSWORD must be configured.}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/music-player-release.jks
          chmod 600 app/music-player-release.jks

      - name: Build Music Player APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$PWD/app/music-player-release.jks" \
          KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          KEY_ALIAS="$KEY_ALIAS" \
          KEY_PASSWORD="$KEY_PASSWORD" \
          gradle :app:assembleRelease \
            -PPAYPAL_QUARTERLY_URL="${{ vars.PAYPAL_QUARTERLY_URL }}" \
            -PPAYPAL_LIFETIME_URL="${{ vars.PAYPAL_LIFETIME_URL }}" \
            -PPAYPAL_WORKER_URL="https://icy-bread-c703.nexaurenstore.workers.dev" \
            -PUPDATE_MANIFEST_URL="https://raw.githubusercontent.com/nexauren1/Music-player-/main/update.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish GitHub Release
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk -F'"' '/versionName =/{print $2}' app/build.gradle.kts | head -1)"
          TAG="v${VERSION}"
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "${APK}" "app-release.apk"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          gh release create "${TAG}" "app-release.apk" \
            --title "Music Player ${VERSION}" \
            --notes "Music Player ${VERSION} release. APK attached."

# PAYPAL_CLIENT_SECRET is intentionally not passed into the Android build.
# Client secrets must stay server-side and must never be embedded in an APK.

      - name: Publish update manifest
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/versionName =/{print $2}' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(awk -F' = ' '/versionCode =/{print $2}' app/build.gradle.kts | head -1 | tr -d '\r')"
          APK="app/build/outputs/apk/release/app-release.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$APK")"
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION}",
            "apkUrl": "https://github.com/nexauren1/Music-player-/releases/latest/download/app-release.apk",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE_BYTES},
            "changelog": "Production release: polished mini player, persistent equalizer, Premium effects, multilingual interface and stability improvements."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update release manifest for ${VERSION}" || true
          git push


# Production release trigger [release]
