name: Release Android APK

on:
  push:
    branches:
      - 'release-v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexauren-release.jks"
          test -s "$RUNNER_TEMP/nexauren-release.jks"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexauren-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease bundleRelease

      - name: Verify signed artifacts
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E "versionName '[^']+'" app/build.gradle | head -1 | sed -E "s/.*versionName '([^']+)'.*/\\1/")
          test -n "$VERSION"
          cat > release-notes.md <<EOF
          Nexauren Music Player $VERSION

          • Reprodução mais resiliente com recuperação automática de falhas de faixa
          • Retoma da reprodução após reinício do serviço/dispositivo
          • Temporizador de sono persistente no serviço de reprodução
          • Controles rápidos de -10 s e +30 s no leitor completo
          • Fila de reprodução com remoção individual e limpeza total
          • Leitura da biblioteca mais compatível com diferentes implementações de MediaStore
          • Permissões de áudio e notificações com fluxo único no arranque
          • Interface protegida contra sobreposição das barras do sistema no Android moderno
          • Equalizador, graves, surround, pré-amplificador, balanço e A-B persistentes
          • Biblioteca de vídeos em grelha, pesquisa, ordenação, pastas e Picture-in-Picture
          EOF
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "${GITHUB_SHA}" \
            --title "Nexauren Music Player v$VERSION" \
            --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nexauren-release.jks"
