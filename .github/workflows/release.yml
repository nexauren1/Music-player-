name: Release Android APK

on:
  push:
    branches:
      - 'release-v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexauren-release.jks"
          test -s "$RUNNER_TEMP/nexauren-release.jks"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexauren-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease bundleRelease

      - name: Verify signed artifacts
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E "versionName '[^']+'" app/build.gradle | head -1 | sed -E "s/.*versionName '([^']+)'.*/\\1/")
          test -n "$VERSION"
          cat > release-notes.md <<EOF
          Nexauren Music Player $VERSION

          • Pesquisa rápida sem acentos e indexação automática quando a biblioteca muda
          • Ordenação inteligente por data de adição e deteção de duplicadas normalizada
          • Biblioteca preparada para coleções muito grandes, com pesquisa em segundo plano
          • Fila de reprodução deslizante para evitar crescimento indefinido durante milhares de faixas
          • Navegação de vídeos integrada na biblioteca
          • Biblioteca de vídeos em grelha, miniaturas em cache, pesquisa, ordenação e pastas
          • Reprodução de vídeo com controles avançados e Picture-in-Picture
          • Equalizador e efeitos de áudio persistentes
          • Mini-player e biblioteca reorganizados
          EOF
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "${GITHUB_SHA}" \
            --title "Nexauren Music Player v$VERSION" \
            --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nexauren-release.jks"
