name: Release Android APK

on:
  push:
    branches:
      - 'release-v0.6.0'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexauren-release.jks"
          test -s "$RUNNER_TEMP/nexauren-release.jks"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexauren-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease bundleRelease

      - name: Verify signed artifacts
        run: |
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.6.0             app/build/outputs/apk/release/app-release.apk             app/build/outputs/bundle/release/app-release.aab             --target "${GITHUB_SHA}"             --title "Nexauren Music Player v0.6.0"             --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nexauren-release.jks"
